[project]
name = "scx-stock-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "akshare>=1.14",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "apscheduler>=3.10",
    "anyio>=4.0",
    "pydantic-settings>=2.0",
    "pypinyin>=0.51",
    "pandas>=2.0",
    "pandas-ta>=0.3.14b1",
    "openai>=1.0",
    "aiosmtplib>=3.0",
    "jinja2>=3.1",
    "pandas-stubs~=3.0.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scx_stock"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
