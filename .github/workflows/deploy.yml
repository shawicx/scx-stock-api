# ============================================================
# @description scx-stock-api CI/CD 工作流（测试 + 部署）
# ------------------------------------------------------------
# 触发条件：
#   - push 到 main：跑测试 → 构建镜像 → 推送 ACR → SSH 部署到 ECS
#   - pull_request 到 main：仅跑测试（不部署）
#   - workflow_dispatch：手动触发完整流程
#
# Job 依赖链：test → (build-and-push → deploy)
#   deploy 仅在 push main / workflow_dispatch 时执行；PR 只跑 test。
#
# 部署链路：
#   docker build → docker tag → docker push (阿里云 ACR)
#   → SSH 登录 ECS → docker pull
#   → 幂等启动 PostgreSQL(5434) + Redis(6389) 依赖
#   → 启动 stock-api 容器（监听 3800，--env-file 注入生产配置）
#   → 健康检查（轮询 /health）
#
# 安全模型：
#   - 生产秘钥（DB/Redis 等）只存在于 ECS 本地 .env 文件
#   - GitHub 仅保存 ACR 凭证与 ECS SSH 凭证
#   - --network host：复用宿主网络，localhost 直连 PG/Redis
#
# 依赖的 GitHub Secrets：
#   ACR_REGISTRY / ACR_NAMESPACE / ACR_USERNAME / ACR_PASSWORD
#   ECS_HOST / ECS_USER / ECS_SSH_KEY / STOCK_ECS_ENV_FILE
# ============================================================

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: { }

concurrency:
  group: cicd-stock-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Job 1：测试（push + PR 均执行）
  # ============================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest

  # ============================================================
  # Job 2：构建镜像并推送到阿里云 ACR（仅 push main / 手动触发）
  # ============================================================
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t scx-stock-api:latest .

      - name: Login to Aliyun ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login "${{ secrets.ACR_REGISTRY }}" \
            -u "${{ secrets.ACR_USERNAME }}" --password-stdin

      - name: Tag & Push image
        env:
          TARGET_NS: ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SHORT="${SHORT_SHA:0:7}"
          TARGET="$TARGET_NS/scx-stock-api"
          echo "==> 推送 scx-stock-api"
          docker tag scx-stock-api:latest "$TARGET:latest"
          docker tag scx-stock-api:latest "$TARGET:sha-$SHORT"
          docker push "$TARGET:latest"
          docker push "$TARGET:sha-$SHORT"
          echo "    ✓ $TARGET:latest (sha-$SHORT)"

  # ============================================================
  # Job 3：SSH 登录 ECS，拉取镜像并启动服务
  # ============================================================
  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: SSH deploy & health check
        uses: appleboy/ssh-action@v1
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          ECS_ENV_FILE: ${{ secrets.STOCK_ECS_ENV_FILE }}
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          command_timeout: 15m
          envs: ACR_REGISTRY,ACR_NAMESPACE,ACR_USERNAME,ACR_PASSWORD,ECS_ENV_FILE
          script: |
            set -euo pipefail

            NS="$ACR_REGISTRY/$ACR_NAMESPACE"
            ENV_FILE="$ECS_ENV_FILE"
            IMAGE="$NS/scx-stock-api:latest"

            echo "==> 校验 .env 文件存在: $ENV_FILE"
            if [ ! -f "$ENV_FILE" ]; then
              echo "ERROR: ECS 上的 .env 文件不存在: $ENV_FILE"
              echo "请先在 ECS 上创建该文件并写入生产环境变量（参考 .env.example）"
              exit 1
            fi

            echo "==> 登录阿里云 ACR"
            docker login "$ACR_REGISTRY" -u "$ACR_USERNAME" -p "$ACR_PASSWORD"

            echo "==> 拉取镜像: $IMAGE"
            docker pull "$IMAGE"

            # ============================================================
            # 确保依赖容器（PostgreSQL + Redis）运行（幂等）
            # 端口 5434/6389 与 scx-backend 的 5433/6388 隔离
            # ============================================================
            echo "==> 确保依赖容器（PostgreSQL + Redis）运行"

            if docker ps -a --format '{{.Names}}' | grep -q '^scx-stock-postgres$'; then
              echo "  PostgreSQL 容器已存在，确保运行中"
              docker start scx-stock-postgres >/dev/null 2>&1 || true
            else
              echo "  PostgreSQL 容器不存在，创建并启动"
              source "$ENV_FILE"
              docker run -d \
                --name scx-stock-postgres \
                --network host \
                --restart unless-stopped \
                -e POSTGRES_USER="${SCX_DB_USER:-scx}" \
                -e POSTGRES_PASSWORD="${SCX_DB_PASSWORD:-scx_password}" \
                -e POSTGRES_DB="${SCX_DB_NAME:-scx-stock}" \
                -v scx-stock-postgres-data:/var/lib/postgresql/data \
                postgres:16-alpine \
                postgres -c port="${SCX_DB_PORT:-5434}"
            fi

            if docker ps -a --format '{{.Names}}' | grep -q '^scx-stock-redis$'; then
              echo "  Redis 容器已存在，确保运行中"
              docker start scx-stock-redis >/dev/null 2>&1 || true
            else
              echo "  Redis 容器不存在，创建并启动"
              source "$ENV_FILE"
              docker run -d \
                --name scx-stock-redis \
                --network host \
                --restart unless-stopped \
                -v scx-stock-redis-data:/data \
                redis:7-alpine \
                redis-server --port "${SCX_REDIS_PORT:-6389}"
            fi

            # 等待 PostgreSQL 就绪
            echo "==> 等待 PostgreSQL 就绪（最长 60 秒）"
            source "$ENV_FILE"
            for i in $(seq 1 30); do
              if docker exec scx-stock-postgres pg_isready -U "${SCX_DB_USER:-scx}" -p "${SCX_DB_PORT:-5434}" >/dev/null 2>&1; then
                echo "  PostgreSQL 就绪"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "ERROR: PostgreSQL 60 秒内未就绪，终止部署"
                docker logs --tail 30 scx-stock-postgres || true
                exit 1
              fi
              echo "  等待 PG... ($i/30)"
              sleep 2
            done

            # ============================================================
            # 启动 stock-api 容器
            # --network host：localhost 直连 PG/Redis
            # --env-file：注入 ECS 本地 .env（含 DB/Redis/CORS 等）
            # ============================================================
            stop_and_rm() {
              docker stop "$1" 2>/dev/null || true
              docker rm   "$1" 2>/dev/null || true
            }

            echo "==> 启动 scx-stock-api (3800)"
            stop_and_rm scx-stock-api
            docker run -d \
              --name scx-stock-api \
              --network host \
              --restart=always \
              --env-file "$ENV_FILE" \
              -m 512m \
              "$IMAGE"

            echo "==> 清理悬空镜像"
            docker image prune -f

            # 健康检查：轮询 /health（最多 60 秒）
            echo "==> 健康检查: 轮询 http://localhost:3800/health"
            for i in $(seq 1 12); do
              if curl -fsS http://localhost:3800/health > /dev/null 2>&1; then
                echo "健康检查通过（第 $((i*5)) 秒）"
                echo "--- 运行中的 stock-api 容器 ---"
                docker ps --filter "name=scx-stock" --format "table {{.Names}}\t{{.Status}}"
                exit 0
              fi
              echo "  等待服务启动... ($i/12)"
              sleep 5
            done

            echo "ERROR: 健康检查超时（60 秒内 stock-api 未就绪）"
            echo "--- 全部 stock 容器状态 ---"
            docker ps -a --filter "name=scx-stock" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            echo "--- stock-api 容器最近日志 ---"
            docker logs --tail 80 scx-stock-api || true
            exit 1
